name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.2.3). Leave blank to tag with commit SHA only.'
        required: false
        type: string
        default: ''
      image:
        description: 'Image(s) to build and push'
        required: true
        type: choice
        default: all
        options:
          - all
          - web
          - api

permissions:
  contents: read
  packages: write
  id-token: write        # cosign OIDC signing
  attestations: write    # SBOM / provenance attestation

env:
  REGISTRY: ghcr.io

jobs:
  # ── Quality gate ─────────────────────────────────────────────────────────
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # ── Docker builds (parallel, each gated by the image selector) ───────────
  build-web:
    name: Build web image
    if: inputs.image == 'all' || inputs.image == 'web'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Next.js web app (chat + portfolio)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          provenance: true
          sbom: true

  build-api:
    name: Build api image
    if: inputs.image == 'all' || inputs.image == 'api'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Express API (chat, profile, projects, contact)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          provenance: true
          sbom: true

  # ── Sign whichever images were built (only when a tag was provided) ───────
  sign:
    name: Sign images
    if: |
      always() &&
      inputs.tag != '' &&
      (needs.build-web.result == 'success' || needs.build-api.result == 'success')
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.2.3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign web image
        if: needs.build-web.result == 'success'
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}/web@${{ needs.build-web.outputs.digest }}

      - name: Sign api image
        if: needs.build-api.result == 'success'
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}/api@${{ needs.build-api.outputs.digest }}
